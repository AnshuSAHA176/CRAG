[project]
name = "crag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anshu Saha", email = "anshusahaa62@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "celery>=5.6.3",
    "cloudinary>=1.46.3",
    "django>=5.2.18",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "dotenv>=0.9.9",
    "langchain>=1.4.4",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.14",
    "nltk>=3.10.3",
    "numpy>=2.4.6",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=1.28.2",
    "redis==5.3.1",
]

[project.scripts]
crag = "crag:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
